    const getUsageMeta = (usage) => {
        switch (usage) {
            case '住宅': return { emoji: '🏠' };
            case '店舗・事務所': return { emoji: '🏪' };
            case 'トランクルーム': return { emoji: '📦' };
            case 'コンテナ': return { emoji: '📦' };
            case 'マンスリー': return { emoji: '🧳' };
            case 'ゲスト': return { emoji: '🛏️' };
            case 'サブリース': return { emoji: '🏢' };
            default: return { emoji: '📌' };
        }
    };

    function sortBuildingsByRateLowFirst(list) {
      return [...list].sort((a, b) => {
        const aN = a.rate != null && !isNaN(a.rate) ? a.rate : null;
        const bN = b.rate != null && !isNaN(b.rate) ? b.rate : null;
        if (aN === null && bN !== null) return 1;
        if (aN !== null && bN === null) return -1;
        if (aN === null && bN === null) return 0;
        return aN - bN;
      });
    }

    function sortByYieldLowFirst(list) {
      return [...list].sort((a, b) => {
        const aN = a.yieldRate != null && !isNaN(a.yieldRate) ? a.yieldRate : null;
        const bN = b.yieldRate != null && !isNaN(b.yieldRate) ? b.yieldRate : null;
        if (aN === null && bN !== null) return 1;
        if (aN !== null && bN === null) return -1;
        if (aN === null && bN === null) return 0;
        return aN - bN;
      });
    }

    // --- ビルカード ---
    function BuildingCard({ building, style, onSelect, viewMode }) {
      const isYield = viewMode === 'yield';
      const value = isYield ? building.yieldRate : building.rate;
      const valueDisplay = value === null || value === undefined ? '—' : value.toFixed(1);
      const valueUnit = value !== null && value !== undefined ? '%' : '';

      return (
        <div
          onClick={() => onSelect(building)}
          className={`relative overflow-hidden flex flex-col p-3 rounded-lg border shadow-sm transition-transform hover:scale-105 cursor-pointer
            ${style.bgColor} ${style.borderColor}`}
        >
          {style.label.includes('危険') || style.label.includes('低利回り') ? <div className="absolute top-0 left-0 w-full h-1 bg-red-500"></div> : null}
          <div className="flex justify-between items-start gap-1 mb-2 mt-1 min-h-[1.25rem]">
            <span className="text-[10px] leading-tight font-semibold text-slate-500 truncate">
              {building.buildingNo ? (
                <><span className="text-slate-400 font-medium mr-0.5">物件番号</span> {building.buildingNo}</>
              ) : (
                <span className="invisible">—</span>
              )}
            </span>

        </div>
      );

    // --- 複合リスク（稼働・利回り 両方赤）一覧モーダル ---
    function CompoundRiskModal({ buildings, onClose, onSelectDetail }) {
      const fmt = (v) => (v === null || v === undefined || (typeof v === 'number' && isNaN(v))) ? '—' : Number(v).toFixed(1);
      const go = (b, mode) => { onSelectDetail(b, mode); onClose(); };
      return (
        <div
          onClick={onClose}
          className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="w-full max-w-lg bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[min(90vh,640px)] modal-animate"
          >
            <div className="relative bg-[#FFF1F1] px-5 pt-5 pb-4 shrink-0 rounded-t-xl">
              <button
                type="button"
                onClick={onClose}
                className="absolute top-3 right-3 w-8 h-8 flex items-center justify-center rounded-full text-slate-400 hover:text-slate-600 hover:bg-black/5 transition-colors"

              >

              </button>
              <div className="flex items-start gap-2.5 pr-10">

                  <p className="text-sm text-red-600 mt-1.5">行の「稼働」→稼働率の詳細、「利回り」→利回りの詳細に開きます。</p>
                </div>
              </div>
            </div>
            <div className="p-3 overflow-y-auto flex-1 bg-white min-h-0">

                <p className="text-center text-slate-400 py-10 text-sm">該当するビルはありません。</p>
              ) : (
                buildings.map((b) => (
                  <div
                    key={b.id}
                    className="mb-2 last:mb-0 p-3 rounded-lg border border-red-200/80 bg-[#FFF5F5] flex justify-between gap-3 transition-colors"
                  >
                    <button
                      type="button"
                      onClick={() => go(b, 'occupancy')}
                      className="min-w-0 flex-1 text-left cursor-pointer rounded-md -m-1 p-1 hover:bg-red-100/50 focus:outline-none focus:ring-2 focus:ring-red-300"
                    >
                      <div className="text-[10px] text-slate-500 mb-0.5">
                        {b.buildingNo != null && b.buildingNo !== '' ? `No.${b.buildingNo}` : b.id}
                      </div>
                      <div className="font-bold text-slate-900 text-sm break-words">{b.name}</div>
                      <p className="text-xs text-slate-500 flex items-start gap-1 mt-0.5">

                    <div className="shrink-0 text-right text-sm font-semibold text-red-600 leading-snug flex flex-col justify-center gap-1.5">
                      <button
                        type="button"
                        onClick={() => go(b, 'occupancy')}
                        className="block w-full pl-2 py-0.5 rounded cursor-pointer text-red-600 hover:bg-red-100/80 focus:outline-none focus:ring-2 focus:ring-red-300"
                        title="稼働率で詳細を開く"

                        className="block w-full pl-2 py-0.5 rounded cursor-pointer text-red-600 hover:bg-red-100/80 focus:outline-none focus:ring-2 focus:ring-red-300"

    // --- 詳細ポップアップモーダル ---
    function BuildingModal({ building, style, onClose, viewMode, onViewModeChange }) {
      if (!building) return null;

      const isYield = viewMode === 'yield';
      const details = building.details || { '情報なし': { total: building.totalRooms || 0, empty: building.emptyRooms || 0 } };
      const totalRooms = building.totalRooms || 0;
      const emptyRooms = building.emptyRooms || 0;
      const activeRooms = totalRooms - emptyRooms;

      const occupancyDisplay = building.rate === null || building.rate === undefined ? '—' : building.rate.toFixed(1);
      const yieldDisplay = building.yieldRate === null || building.yieldRate === undefined ? '—' : building.yieldRate.toFixed(1);
      const mainDisplay = isYield ? yieldDisplay : occupancyDisplay;
      const mainUnit = (isYield ? building.yieldRate : building.rate) !== null ? '%' : '';

      return (
        <div
          onClick={onClose}
          className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden modal-animate"
          >
            <div className={`p-5 border-b border-slate-200 relative ${style.bgColor}`}>

                <div className="flex flex-wrap items-center gap-2 mb-2 pr-8">

                </div>
                <h3 className="text-xl font-bold text-slate-900 mb-1">{building.name}</h3>
                <p className="text-sm text-slate-600 flex items-center gap-1.5">
                    <IconMapPin className="w-3.5 h-3.5 text-slate-400" />
                    {building.address || '所在地情報なし'}
                </p>
            </div>

            <div className="p-6 space-y-5 max-h-[70vh] overflow-y-auto">

              {onViewModeChange && (
                <div className="flex items-center gap-2 flex-wrap -mt-0.5 pb-1 border-b border-slate-100">
                  <span className="text-xs text-slate-500 font-medium shrink-0">表示:</span>
                  <div className="flex bg-slate-100 rounded-lg p-0.5 gap-0.5">
                    <button
                      type="button"
                      onClick={() => onViewModeChange('occupancy')}
                      className={`px-3 py-1.5 text-sm font-semibold rounded-md transition-colors ${!isYield ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}

                      📊 稼働率
                    </button>
                    <button
                      type="button"
                      onClick={() => onViewModeChange('yield')}
                      className={`px-3 py-1.5 text-sm font-semibold rounded-md transition-colors ${isYield ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}

                      💰 利回り
                    </button>
                  </div>
                </div>
              )}

              {/* 稼働率モード: サマリー */}
              {!isYield && (
                <>
                  <div>
                    <h4 className="text-sm font-bold text-slate-800 mb-2">【 稼働率サマリー 】</h4>
                    <div className="flex items-center border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <div className="w-1/2 border-r border-slate-300 flex justify-center items-center pr-4">

              )}

              {/* 利回りモード: 収益サマリー */}
              {isYield && (
                <>
                  <div>
                    <h4 className="text-sm font-bold text-slate-800 mb-2">【 利回りサマリー 】</h4>
                    <div className="flex items-center border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <div className="w-1/2 border-r border-slate-300 flex justify-center items-center pr-4">

                      <div className="w-1/2 pl-6 space-y-1.5">
                        <div className="flex justify-between text-sm">
                          <span className="text-slate-500">年間賃料収入:</span>
                          <span className="font-mono font-bold text-slate-800">{formatMan(building.annualIncome)}</span>

                        <div className="flex justify-between text-sm">

                          <span className="font-mono font-bold text-slate-800">{formatMan(building.acqPrice)}</span>

                          <span className="text-slate-500">月額換算:</span>

                  <div>
                    <h4 className="text-sm font-bold text-slate-800 mb-2">【 稼働率（参考） 】</h4>

                      <div className="text-center w-20 shrink-0">
                        <p className={`text-2xl font-black ${building.status === 'danger' ? 'text-red-600' : building.status === 'warning' ? 'text-yellow-600' : 'text-emerald-600'}`}>
                          {occupancyDisplay}{building.rate !== null ? '%' : ''}
                        </p>
                        <p className="text-xs text-slate-400">稼働率</p>
                      </div>
                      <div className="flex-1 space-y-1 text-sm">
                        <div className="flex justify-between">
                          <span className="text-slate-500">総戸数:</span>
                          <span className="font-mono font-bold">{totalRooms}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-500">空室数:</span>

                        </div>

              )}

            </div>
          </div>

      );
    }

    // --- 億・万円フォーマット ---
    function formatMan(man) {
      if (man == null) return '—';
      const fmt = (n) => n.toLocaleString('ja-JP');
      if (man >= 10000) {
        const oku = Math.floor(man / 10000);
        const sen = man % 10000;
        return sen > 0 ? `${fmt(oku)}億${fmt(sen)}万円` : `${fmt(oku)}億円`;
      }
      return `${fmt(man)}万円`;
    }

    // --- Excel解析ヘルパー ---
    function parseExcelNumber(val) {
      if (val == null || val === '') return 0;
      if (typeof val === 'number') return val;
      const num = Number(String(val).replace(/,/g, '').trim());
      return isNaN(num) ? 0 : num;
    }

    function usageLabelFromHeader(header, kind) {
      let s = String(header).replace(/\u3000/g, ' ').trim();
      if (kind === 'total') s = s.replace(/総戸数・|総戸数|総区画数|戸数/gi, '').trim();
      else                  s = s.replace(/空き数・|空き数|空室数|空室|空き/gi, '').trim();
      return s;
    }

    function buildTotalVacantPairs(headers, totalCols, vacantCols) {
      const pairs = [];
      const usedVac = new Set();
      if (totalCols.length === vacantCols.length) {
        for (let i = 0; i < totalCols.length; i++) {
          const usage = usageLabelFromHeader(headers[totalCols[i]], 'total')
                     || usageLabelFromHeader(headers[vacantCols[i]], 'vacant')
                     || (totalCols.length === 1 ? '全体' : `用途${i + 1}`);
          pairs.push({ usage, tc: totalCols[i], vc: vacantCols[i] });
        }
        return pairs;
      }
      for (const tc of totalCols) {
        const lt = usageLabelFromHeader(headers[tc], 'total');
        const vc = vacantCols.find(v => {
          if (usedVac.has(v)) return false;
          const lv = usageLabelFromHeader(headers[v], 'vacant');
          return lt && lv && lt === lv;
        });
        if (vc !== undefined) { usedVac.add(vc); pairs.push({ usage: lt, tc, vc }); }
      }
      let anon = 0;
      for (const tc of totalCols) {
        if (pairs.some(p => p.tc === tc)) continue;
        const vc = vacantCols.find(v => !usedVac.has(v));
        if (vc === undefined) break;
        usedVac.add(vc); anon++;
        const usage = usageLabelFromHeader(headers[tc], 'total')
                   || usageLabelFromHeader(headers[vc], 'vacant')
                   || `区画${anon}`;
        pairs.push({ usage, tc, vc });
      }
      return pairs;
    }

    function extractBuildingDataFromRows(rows) {
      if (rows.length < 2) throw new Error('データが1行以上必要です。Excelファイルの内容を確認してください。');
      const headers  = rows[0].map(h => String(h));
      const totalCols  = [];
      const vacantCols = [];
      headers.forEach((h, idx) => {
        if (/総戸数|総区画数/.test(h)) totalCols.push(idx);
        if (/空き数|空室数|空室/.test(h))  vacantCols.push(idx);
      });
      if (totalCols.length === 0) throw new Error('「総戸数」または「総区画数」の列が見つかりません。1行目のヘッダーを確認してください。');
      if (vacantCols.length === 0) throw new Error('「空き数」「空室数」「空室」のいずれかの列が見つかりません。1行目のヘッダーを確認してください。');
      const pairs = buildTotalVacantPairs(headers, totalCols, vacantCols);
      if (pairs.length === 0) return [];
      const nameCol    = headers.findIndex(h => /物件名|建物名|名称/.test(h));
      const addressCol = headers.findIndex(h => /住所|所在地/.test(h));
      const noCol      = headers.findIndex(h => /物件番号/.test(h));
      if (noCol < 0) throw new Error('「物件番号」の列が見つかりません。1行目のヘッダーを確認してください。');
      // 同シート内の利回り列を探す
      const yieldCol   = headers.findIndex(h => /利回り/.test(h));
      const priceCol   = headers.findIndex(h => /購入価格|取得価格/.test(h));
      const buildings = [];
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        const buildingNo = String(row[noCol] != null ? row[noCol] : '').trim();
        const details = {};
        let totalRooms = 0, emptyRooms = 0;
        for (const p of pairs) {
          const t = parseExcelNumber(row[p.tc]);
          const e = parseExcelNumber(row[p.vc]);
          if (t === 0) continue;
          let key = p.usage;
          if (details[key]) key = `${key} (${p.tc})`;
          details[key] = { total: t, empty: e };
          totalRooms += t; emptyRooms += e;
        }
        let rate = null, status = 'unknown';
        if (totalRooms > 0) {
          rate   = Math.round((1 - emptyRooms / totalRooms) * 1000) / 10;
          status = rate < 70 ? 'danger' : rate < 90 ? 'warning' : 'safe';
        }
        // 利回りデータ（小数 0.08 → 8% に変換）
        let yieldRate = null, yieldStatus = 'unknown', annualIncome = null, acqPrice = null;
        if (yieldCol >= 0) {
          const rawY = parseFloat(row[yieldCol]);
          if (!isNaN(rawY) && rawY > 0) {
            yieldRate = rawY < 1 ? Math.round(rawY * 1000) / 10 : Math.round(rawY * 10) / 10;
            yieldStatus = yieldRate >= 7 ? 'safe' : yieldRate >= 4 ? 'warning' : 'danger';
          }
        }
        if (priceCol >= 0) {
          const rawP = parseExcelNumber(row[priceCol]);
          if (rawP > 0) {
            acqPrice     = Math.round(rawP / 10000); // 万円
            annualIncome = yieldRate != null ? Math.round(rawP * (yieldRate / 100) / 10000) : null;
          }
        }
        const name    = nameCol    >= 0 ? String(row[nameCol]    || '').trim() : String(row[2] || '');
        const address = addressCol >= 0 ? String(row[addressCol] || '').trim() : '';
        buildings.push({ name: name || `（物件名不明 行${i + 1}）`, rate, status, address, buildingNo, totalRooms, emptyRooms, details, yieldRate, yieldStatus, annualIncome, acqPrice });
      }
      return buildings;
    }

    // --- コンパクト形式 → 表示用オブジェクトに変換 ---
    function expandBuildings(compact) {
      return compact.map((b, i) => {
        const bn = typeof b.bn === 'string' || typeof b.bn === 'number' ? String(b.bn) : '';
        return {
          id: bn ? `bn-${bn}-${i}` : `B-${String(i + 1).padStart(3, '0')}`,
          name: b.n, rate: typeof b.r === 'number' ? b.r : null,
          status: typeof b.s === 'string' ? b.s : 'unknown',
          address: typeof b.a === 'string' ? b.a : '',
          totalRooms: typeof b.tr === 'number' ? b.tr : 0,
          emptyRooms: typeof b.er === 'number' ? b.er : 0,
          buildingNo: bn,
          details: b.d
            ? Object.fromEntries(Object.entries(b.d).map(([k, v]) => [k, { total: v.t, empty: v.e }]))
            : {},
          yieldRate:    typeof b.yr === 'number' ? b.yr : null,
          annualIncome: typeof b.ai === 'number' ? b.ai : null,
          acqPrice:     typeof b.ap === 'number' ? b.ap : null,
          yieldStatus:  typeof b.ys === 'string' ? b.ys : 'unknown',
        };
      });
    }

    // --- 利回りシート解析 ---
    function extractYieldDataFromRows(rows) {
      if (rows.length < 2) return {};
      const headers  = rows[0].map(h => String(h));
      const noCol    = headers.findIndex(h => /物件番号/.test(h));
      const yieldCol = headers.findIndex(h => /利回り/.test(h));
      const incomeCol= headers.findIndex(h => /年間賃料|賃料収入/.test(h));
      const priceCol = headers.findIndex(h => /取得価格|購入価格/.test(h));
      if (noCol < 0 || yieldCol < 0) return {};
      const result = {};
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        const bn  = String(row[noCol] ?? '').trim();
        if (!bn) continue;
        const yr  = parseFloat(row[yieldCol]);
        const isNum = !isNaN(yr) && yr > 0;
        result[bn] = {
          yieldRate:    isNum ? yr : null,
          annualIncome: incomeCol >= 0 ? parseExcelNumber(row[incomeCol]) : null,
          acqPrice:     priceCol  >= 0 ? parseExcelNumber(row[priceCol])  : null,
          yieldStatus:  !isNum ? 'unknown' : yr >= 7 ? 'safe' : yr >= 4 ? 'warning' : 'danger',
        };
      }
      return result;
    }

    // --- データ取得（優先順: localStorage → data/buildings.js → サンプル） ---
    function fetchData(onSuccess, onError) {
      try {
        // 優先①: ブラウザでアップロードしたデータ（F5後も維持）
        const raw       = localStorage.getItem('buildingData');
        const fileName  = localStorage.getItem('fileName')  || '';
        const updatedAt = localStorage.getItem('updatedAt') || '';
        if (raw) {
          const buildings = expandBuildings(JSON.parse(raw));
          setTimeout(() => onSuccess({ buildings, fileName, updatedAt }), 50);
          return;
        }
        // 優先②: 更新.bat で生成した data/buildings.js
        if (window.BUILDING_DATA &&
            typeof window.BUILDING_DATA === 'object' &&
            Array.isArray(window.BUILDING_DATA.buildings) &&
            window.BUILDING_DATA.buildings.every(b => b && typeof b === 'object')) {
          const { buildings: compact, fileName, updatedAt } = window.BUILDING_DATA;
          const buildings = expandBuildings(compact);
          setTimeout(() => onSuccess({ buildings, fileName, updatedAt }), 50);
          return;
        }
        // 優先③: 組み込みサンプル
        const buildings = expandBuildings(SAMPLE_BUILDINGS);
        setTimeout(() => onSuccess({ buildings, fileName: 'サンプルデータ', updatedAt: '（デモ用）', isSample: true }), 50);
      } catch (e) {
        setTimeout(() => onError('データの読み込みに失敗しました: ' + e.message), 50);
      }
    }

    function App() {
      const [data, setData]         = useState(null);
      const [filter, setFilter]     = useState('all');
      const [viewMode, setViewMode] = useState('occupancy'); // 'occupancy' | 'yield'
      const [loading, setLoading]   = useState(true);
      const [error, setError]       = useState('');
      const [refreshing, setRefreshing] = useState(false);
      const [selectedBuilding, setSelectedBuilding] = useState(null);
      const [uploading, setUploading]   = useState(false);
      const [uploadMsg, setUploadMsg]   = useState(null);
      const fileInputRef = useRef(null);

      const load = useCallback((isRefresh = false) => {
        if (isRefresh) setRefreshing(true);
        else setLoading(true);
        setError('');
        fetchData(
          (result) => {
            if (result && !Array.isArray(result.buildings)) result = { ...result, buildings: [] };
            setData(result);
            setLoading(false);
            setRefreshing(false);
          },
          (msg) => { setError(msg); setLoading(false); setRefreshing(false); }
        );
      }, []);

      useEffect(() => { load(); }, [load]);

      const handleFileChange = useCallback((e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        e.target.value = '';
        const allowedMimes = [
          'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
          'application/vnd.ms-excel',
        ];
        const ext = file.name.split('.').pop().toLowerCase();
        if (!allowedMimes.includes(file.type) && ext !== 'xlsx' && ext !== 'xls') {
          setUploadMsg({ type: 'error', text: 'XLSXまたはXLSファイルをアップロードしてください。' });
          return;
        }
        if (file.size > 50 * 1024 * 1024) {
          setUploadMsg({ type: 'error', text: 'ファイルが大きすぎます（最大50MB）。' });
          return;
        }
        setUploading(true);
        setUploadMsg(null);
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data     = new Uint8Array(ev.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet    = workbook.Sheets[workbook.SheetNames[0]];
            const rows     = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            const buildings = extractBuildingDataFromRows(rows);
            if (workbook.SheetNames.length > 1) {
              const sheet2 = workbook.Sheets[workbook.SheetNames[1]];
              const rows2  = XLSX.utils.sheet_to_json(sheet2, { header: 1, defval: '' });
              const yieldMap = extractYieldDataFromRows(rows2);
              buildings.forEach(b => {
                const yd = yieldMap[b.buildingNo] || {};
                b.yieldRate    = yd.yieldRate    ?? null;
                b.annualIncome = yd.annualIncome ?? null;
                b.acqPrice     = yd.acqPrice     ?? null;
                b.yieldStatus  = yd.yieldStatus  ?? 'unknown';
              });
            }
            if (buildings.length === 0) {
              setUploading(false);
              setUploadMsg({ type: 'error', text: '1行目に「物件番号」「物件名」「総戸数」「空き数」を含む列が必要です。' });
              return;
            }
            const compact = buildings.map(b => ({
              n: b.name, r: b.rate, s: b.status, a: b.address,
              tr: b.totalRooms, er: b.emptyRooms, bn: b.buildingNo,
              d: Object.fromEntries(Object.entries(b.details).map(([k, v]) => [k, { t: v.total, e: v.empty }])),
              yr: b.yieldRate, ai: b.annualIncome, ap: b.acqPrice, ys: b.yieldStatus,
            }));
            const updatedAt = new Date().toLocaleString('ja-JP');
            try {
              localStorage.setItem('buildingData', JSON.stringify(compact));
              localStorage.setItem('fileName',     file.name);
              localStorage.setItem('updatedAt',    updatedAt);
            } catch (storageErr) {
              setUploading(false);
              setUploadMsg({ type: 'error', text: 'ブラウザのストレージ容量が不足しています。不要なデータを削除してください。' });
              return;
            }
            // data/buildings.js より localStorage を優先させる
            if (window.BUILDING_DATA) window.BUILDING_DATA = null;
            setUploading(false);
            setUploadMsg({ type: 'success', text: `${buildings.length}棟のデータを更新しました。` });
            load(true);
          } catch (err) {
            setUploading(false);
            setUploadMsg({ type: 'error', text: 'ファイルの読み込みに失敗しました: ' + err.message });
          }
        };
        reader.onerror = () => { setUploading(false); setUploadMsg({ type: 'error', text: 'ファイルの読み込みに失敗しました。' }); };
        reader.readAsArrayBuffer(file);
      }, [load]);

      const buildings = useMemo(() => {
        if (!data) return [];
        return Array.isArray(data.buildings) ? data.buildings : [];
      }, [data]);

      const counts = useMemo(() => {
        const sf = viewMode === 'yield' ? 'yieldStatus' : 'status';
        return {
          total:    buildings.length,
          danger:   buildings.filter(b => b[sf] === 'danger').length,
          warning:  buildings.filter(b => b[sf] === 'warning').length,
          safe:     buildings.filter(b => b[sf] === 'safe').length,
          unknown:  buildings.filter(b => b[sf] === 'unknown').length,
          compound: buildings.filter(b => b.status === 'danger' && b.yieldStatus === 'danger').length,
        };
      }, [buildings, viewMode]);

      const filteredBuildings = useMemo(() => {
        const sf = viewMode === 'yield' ? 'yieldStatus' : 'status';
        let list;
        if (filter === 'compound') {
          list = buildings.filter(b => b.status === 'danger' && b.yieldStatus === 'danger');
        } else if (filter === 'all') {
          list = buildings;
        } else {
          list = buildings.filter(b => b[sf] === filter);
        }
        if (filter === 'all' || filter === 'compound') return list;
        return viewMode === 'yield' ? sortByYieldLowFirst(list) : sortBuildingsByRateLowFirst(list);
      }, [filter, buildings, viewMode]);

      const occupancyStyles = {
        danger:  { color: 'text-red-600',     bgColor: 'bg-red-50',    borderColor: 'border-red-500',   icon: <IconAlertTriangle className="w-5 h-5 text-red-600" />,   label: '危険 (<70%)',   dot: 'bg-red-500',     glow: true  },
        warning: { color: 'text-yellow-600',  bgColor: 'bg-yellow-50', borderColor: 'border-yellow-400',icon: <IconAlertCircle   className="w-5 h-5 text-yellow-600" />,  label: '注意 (70-89%)', dot: 'bg-yellow-400',  glow: false },
        safe:    { color: 'text-emerald-600', bgColor: 'bg-white',     borderColor: 'border-gray-200',  icon: <IconCheckCircle   className="w-5 h-5 text-emerald-500" />, label: '順調 (90%+)',   dot: 'bg-emerald-500', glow: false },
        unknown: { color: 'text-slate-600',   bgColor: 'bg-slate-50',  borderColor: 'border-slate-200', icon: <IconAlertCircle   className="w-5 h-5 text-slate-600" />,   label: 'データなし',     dot: 'bg-slate-300',   glow: false },
      };
      const yieldStyles = {
        danger:  { color: 'text-red-600',     bgColor: 'bg-red-50',    borderColor: 'border-red-500',   icon: <IconAlertTriangle className="w-5 h-5 text-red-600" />,   label: '低利回り (<4%)', dot: 'bg-red-500',     glow: true  },
        warning: { color: 'text-yellow-600',  bgColor: 'bg-yellow-50', borderColor: 'border-yellow-400',icon: <IconAlertCircle   className="w-5 h-5 text-yellow-600" />,  label: '注意 (4-6.9%)', dot: 'bg-yellow-400',  glow: false },
        safe:    { color: 'text-blue-600',    bgColor: 'bg-blue-50',   borderColor: 'border-blue-300',  icon: <IconCheckCircle   className="w-5 h-5 text-blue-500" />,   label: '高利回り (7%+)', dot: 'bg-blue-500',    glow: false },
        unknown: { color: 'text-slate-600',   bgColor: 'bg-slate-50',  borderColor: 'border-slate-200', icon: <IconAlertCircle   className="w-5 h-5 text-slate-600" />,   label: 'データなし',     dot: 'bg-slate-300',   glow: false },
      };
      const statusStyles = viewMode === 'yield' ? yieldStyles : occupancyStyles;
      const getEffectiveStatus = (b) => viewMode === 'yield' ? (b.yieldStatus || 'unknown') : (b.status || 'unknown');

      if (loading) {
        return (
          <div className="min-h-screen bg-slate-100 flex items-center justify-center">
            <div className="text-center">
              <IconRefresh className="w-10 h-10 text-blue-500 mx-auto mb-3 animate-spin" />
              <p className="text-slate-600 font-medium">データを読み込んでいます…</p>
            </div>
          </div>
        );
      }

      const dangerLabel   = viewMode === 'yield' ? '低利回り (<5%)' : '危険 (<70%)';
      const warningLabel  = viewMode === 'yield' ? '注意 (5-7.9%)'  : '注意 (70-89%)';
      const safeLabel     = viewMode === 'yield' ? '高利回り (8%+)' : '順調 (90%+)';

      const getFilterTitle = () => {
          if (filter === 'compound') return '複合リスク物件（稼働率・利回り ともに要注意）';
          if (filter === 'all')     return '全ビル一覧（取得順）';
          if (filter === 'danger')  return viewMode === 'yield' ? '低利回り物件一覧' : '要注意ビル一覧';
          if (filter === 'warning') return '警戒ビル一覧';
          if (filter === 'safe')    return viewMode === 'yield' ? '高利回り物件一覧' : '順調ビル一覧';
          if (filter === 'unknown') return 'データなし・計算対象外ビル一覧';
          return '';
      };

      return (
      <React.Fragment>
        <div className="min-h-screen bg-slate-100 text-slate-800 p-4 font-sans">
          <div className="max-w-7xl mx-auto space-y-6">

            <header className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
              <div className="flex flex-col md:flex-row md:items-start justify-between gap-4">
                <div>
                  <h1 className="text-2xl font-bold text-slate-900 flex items-center gap-2">
                    <IconBuilding className="w-6 h-6 text-blue-600" />
                    ビジネスシグナル | 物件
                    {data?.isSample && (
                      <span className="text-xs font-bold bg-blue-100 text-blue-600 border border-blue-300 px-2 py-0.5 rounded-full ml-1">SAMPLE</span>
                    )}
                  </h1>
                  <p className="text-slate-500 mt-1 text-sm">
                    {data ? `${data.fileName}（${counts.total}棟）` : 'データがまだありません。'}
                  </p>

                  {/* モード切替トグル */}
                  <div className="flex items-center gap-2 mt-3 flex-wrap">
                    <div className="flex bg-slate-100 rounded-lg p-0.5 gap-0.5">
                      <button
                        onClick={() => setViewMode('occupancy')}
                        className={`px-3 py-1.5 text-sm font-semibold rounded-md transition-colors ${viewMode === 'occupancy' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                      >
                        📊 稼働率
                      </button>
                      <button
                        onClick={() => setViewMode('yield')}
                        className={`px-3 py-1.5 text-sm font-semibold rounded-md transition-colors ${viewMode === 'yield' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                      >
                        💰 利回り
                      </button>
                    </div>
                    <button
                      onClick={() => counts.compound > 0 && setFilter(filter === 'compound' ? 'all' : 'compound')}
                      className={`px-3 py-1.5 text-sm font-semibold rounded-lg border transition-colors flex items-center gap-1.5 ${filter === 'compound' ? 'bg-red-600 text-white border-red-600' : counts.compound > 0 ? 'bg-white text-red-600 border-red-300 hover:bg-red-50' : 'bg-white text-slate-300 border-slate-200 cursor-default'}`}
                    >
                      <span className={`w-2 h-2 rounded-full inline-block ${counts.compound > 0 ? 'bg-red-400 animate-pulse' : 'bg-slate-300'}`}></span>
                      複合リスク {counts.compound}棟
                    </button>
                  </div>
                </div>

                <div className="flex items-center gap-3 shrink-0">
                  {data && (
                    <div className="text-right">
                      <p className="text-sm text-slate-500">最終更新</p>
                      <p className="font-medium">{data.updatedAt}</p>
                    </div>
                  )}
                  <input ref={fileInputRef} type="file" accept=".xlsx,.xls" className="hidden" onChange={handleFileChange} />
                  <button
                    onClick={() => fileInputRef.current && fileInputRef.current.click()}
                    disabled={uploading}
                    className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors disabled:opacity-50"
                  >
                    <IconUpload className={`w-4 h-4 ${uploading ? 'animate-spin' : ''}`} />
                    {uploading ? 'アップロード中…' : 'Excelをアップロード'}
                  </button>
                </div>
              </div>
            </header>

            {error && (
              <div role="alert" aria-live="assertive" className="bg-red-50 border border-red-300 text-red-700 rounded-xl p-4 flex items-center gap-2">
                <IconAlertTriangle className="w-5 h-5 shrink-0" />
                <span>{error}</span>
              </div>
            )}

            {uploadMsg && (
              <div role="alert" aria-live="polite" className={`rounded-xl p-4 flex items-center justify-between gap-2 ${uploadMsg.type === 'success' ? 'bg-emerald-50 border border-emerald-300 text-emerald-700' : 'bg-red-50 border border-red-300 text-red-700'}`}>
                <div className="flex items-center gap-2">
                  {uploadMsg.type === 'success' ? <IconCheckCircle className="w-5 h-5 shrink-0" /> : <IconAlertTriangle className="w-5 h-5 shrink-0" />}
                  <span>{uploadMsg.text}</span>
                </div>
                <button onClick={() => setUploadMsg(null)} className="opacity-60 hover:opacity-100 transition-opacity shrink-0" aria-label="メッセージを閉じる">
                  <IconX className="w-4 h-4" />
                </button>
              </div>
            )}

            {data && (
              <>
                {/* サマリーカード */}
                <section aria-labelledby="summary-heading">
                  <h2 id="summary-heading" className="sr-only">統計サマリー</h2>
                <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                  <div onClick={() => setFilter('all')} className={`p-4 rounded-xl border cursor-pointer transition-all ${filter === 'all' ? 'bg-blue-50 border-blue-400 shadow-md ring-2 ring-blue-200' : 'bg-white border-slate-200 hover:bg-slate-50 shadow-sm'}`}>
                    <p className="text-sm font-medium text-slate-500 mb-1">管理物件総数</p>
                    <div className="flex items-end gap-2">
                      <span className="text-3xl font-bold text-slate-800">{counts.total}</span>
                      <span className="text-slate-500 mb-1">棟</span>
                    </div>
                  </div>
                  <div onClick={() => setFilter('danger')} className={`p-4 rounded-xl border cursor-pointer transition-all ${filter === 'danger' ? 'bg-red-50 border-red-500 shadow-md ring-2 ring-red-200' : 'bg-white border-slate-200 hover:bg-red-50 shadow-sm'}`}>
                    <p className="text-sm font-medium text-red-600 mb-1 flex items-center gap-1">
                      <span className="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse inline-block"></span>
                      {viewMode === 'yield' ? '低利回り (<4%)' : '危険 (<70%)'}
                    </p>
                    <div className="flex items-end gap-2">
                      <span className="text-3xl font-bold text-red-600">{counts.danger}</span>
                      <span className="text-red-400 mb-1">棟</span>
                    </div>
                  </div>
                  <div onClick={() => setFilter('warning')} className={`p-4 rounded-xl border cursor-pointer transition-all ${filter === 'warning' ? 'bg-yellow-50 border-yellow-500 shadow-md ring-2 ring-yellow-200' : 'bg-white border-slate-200 hover:bg-yellow-50 shadow-sm'}`}>
                    <p className="text-sm font-medium text-yellow-600 mb-1 flex items-center gap-1">
                      <span className="w-2.5 h-2.5 rounded-full bg-yellow-400 inline-block"></span>
                      {viewMode === 'yield' ? '注意 (4-6.9%)' : '注意 (70-89%)'}
                    </p>
                    <div className="flex items-end gap-2">
                      <span className="text-3xl font-bold text-yellow-600">{counts.warning}</span>
                      <span className="text-yellow-500 mb-1">棟</span>
                    </div>
                  </div>
                  <div onClick={() => setFilter('safe')} className={`p-4 rounded-xl border cursor-pointer transition-all ${filter === 'safe' ? (viewMode === 'yield' ? 'bg-blue-50 border-blue-500 shadow-md ring-2 ring-blue-200' : 'bg-emerald-50 border-emerald-500 shadow-md ring-2 ring-emerald-200') : (viewMode === 'yield' ? 'bg-white border-slate-200 hover:bg-blue-50 shadow-sm' : 'bg-white border-slate-200 hover:bg-emerald-50 shadow-sm')}`}>
                    <p className={`text-sm font-medium mb-1 flex items-center gap-1 ${viewMode === 'yield' ? 'text-blue-600' : 'text-emerald-600'}`}>
                      <span className={`w-2.5 h-2.5 rounded-full inline-block ${viewMode === 'yield' ? 'bg-blue-500' : 'bg-emerald-500'}`}></span>
                      {viewMode === 'yield' ? '高利回り (7%+)' : '順調 (90%+)'}
                    </p>
                    <div className="flex items-end gap-2">
                      <span className={`text-3xl font-bold ${viewMode === 'yield' ? 'text-blue-600' : 'text-emerald-600'}`}>{counts.safe}</span>
                      <span className={`mb-1 ${viewMode === 'yield' ? 'text-blue-500' : 'text-emerald-500'}`}>棟</span>
                    </div>
                  </div>
                  <div onClick={() => setFilter('unknown')} className={`p-4 rounded-xl border cursor-pointer transition-all ${filter === 'unknown' ? 'bg-slate-100 border-slate-400 shadow-md ring-2 ring-slate-200' : 'bg-white border-slate-200 hover:bg-slate-50 shadow-sm'}`}>
                    <p className="text-sm font-medium text-slate-500 mb-1 flex items-center gap-1">
                      <span className="w-2.5 h-2.5 rounded-full bg-slate-300 inline-block"></span>データなし
                    </p>
                    <div className="flex items-end gap-2">
                      <span className="text-3xl font-bold text-slate-600">{counts.unknown}</span>
                      <span className="text-slate-400 mb-1">棟</span>
                    </div>
                  </div>
                </div>
                </section>

                {/* カードグリッド（複合リスク時は専用モーダルに任せ、ここは非表示） */}
                {filter !== 'compound' && (
                <section aria-labelledby="building-list-heading">
                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                  <div className="flex items-center justify-between mb-6 border-b border-slate-100 pb-4">
                    <h2 id="building-list-heading" className="text-lg font-bold flex items-center gap-2">
                      {filter === 'danger'   && <span className="w-3 h-3 rounded-full bg-red-500 animate-pulse inline-block"></span>}
                      {filter === 'warning'  && <span className="w-3 h-3 rounded-full bg-yellow-400 inline-block"></span>}
                      {filter === 'safe'     && <span className="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>}
                      {filter === 'unknown'  && <span className="w-3 h-3 rounded-full bg-slate-300 inline-block"></span>}
                      {filter === 'all'      && <IconTrendingUp className="w-6 h-6 text-slate-500 shrink-0" />}
                      {getFilterTitle()}
                      <span className="text-slate-400 text-sm font-normal ml-2">({filteredBuildings.length}件)</span>
                    </h2>
                    <div className="hidden md:flex items-center gap-4 text-sm font-semibold text-slate-600">
                      <span className="text-slate-500 font-medium">判定基準</span>
                      <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-red-500 inline-block shrink-0"></span>{viewMode === 'yield' ? '低利回り (<4%)' : '危険 (<70%)'}</span>
                      <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-yellow-400 inline-block shrink-0"></span>{viewMode === 'yield' ? '注意 (4〜6.9%)' : '注意 (70〜89%)'}</span>
                      <span className="flex items-center gap-1.5"><span className={`w-3 h-3 rounded-full inline-block shrink-0 ${viewMode === 'yield' ? 'bg-blue-500' : 'bg-emerald-500'}`}></span>{viewMode === 'yield' ? '高利回り (7%+)' : '順調 (90%+)'}</span>
                      <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-slate-300 inline-block shrink-0"></span>データなし</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
                    {filteredBuildings.map((building) => (
                      <BuildingCard
                        key={building.id}
                        building={building}
                        style={statusStyles[getEffectiveStatus(building)] || statusStyles.unknown}
                        onSelect={setSelectedBuilding}
                        viewMode={viewMode}
                      />
                    ))}
                  </div>

                  {filteredBuildings.length === 0 && (
                    <div className="text-center py-12 text-slate-400">該当するビルはありません。</div>
                  )}
                </div>
                </section>
                )}
              </>
            )}

          </div>
        </div>

        {data && filter === 'compound' && (
          <CompoundRiskModal
            buildings={filteredBuildings}
            onClose={() => setFilter('all')}
            onSelectDetail={(b, mode) => {
              setViewMode(mode);
              setSelectedBuilding(b);
            }}
          />
        )}

        <BuildingModal
          building={selectedBuilding}
          style={selectedBuilding ? (statusStyles[getEffectiveStatus(selectedBuilding)] || statusStyles.unknown) : null}
          onClose={() => setSelectedBuilding(null)}
          viewMode={viewMode}
          onViewModeChange={(m) => { setViewMode(m); setFilter('all'); }}
        />
      </React.Fragment>
      );
    }

    (function mount() {
      const el = document.getElementById('root');
      if (!el) return;
      try {
        const app = <App />;
        if (typeof ReactDOM.createRoot === 'function') {
          ReactDOM.createRoot(el).render(app);
        } else if (typeof ReactDOM.render === 'function') {
          ReactDOM.render(app, el);
        } else {
          el.innerHTML = '<p style="padding:1rem;font-family:sans-serif">ReactDOM が利用できません。react / react-dom の読み込みを確認してください。</p>';
        }
      } catch (err) {
        const p = document.createElement('p');
        p.style.cssText = 'padding:1rem;font-family:sans-serif;color:#b91c1c';
        p.textContent = '表示エラー: ' + String(err && err.message ? err.message : err);
        el.appendChild(p);
        console.error(err);
      }
    })();
  </script>
</body>
</html>
